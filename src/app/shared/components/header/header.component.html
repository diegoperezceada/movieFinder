<header
  [ngClass]="
    isScrolled()
      ? 'bg-black/80 backdrop-blur-md py-3 shadow-2xl'
      : 'bg-transparent py-5'
  "
  class="fixed top-0 left-0 w-full z-50 transition-all duration-500 ease-in-out"
>
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
    <div class="flex items-center cursor-pointer group">
      <span
        routerLink="/"
        class="text-2xl font-black tracking-tighter text-white"
      >
        MOVIE<span
          class="text-red-600 group-hover:text-red-500 transition-colors"
          >FLIX</span
        >
      </span>
    </div>

    <div class="flex items-center gap-5 relative">
      <div class="flex flex-col items-end">
        <div class="flex items-center">
          <input
            #searchInput
            [class.w-64]="showSearch()"
            [class.w-0]="!showSearch()"
            [class.opacity-0]="!showSearch()"
            (input)="onTyping($event)"
            type="text"
            placeholder="Buscar película..."
            class="bg-black/60 border border-white/20 rounded-full py-1.5 px-4 text-sm transition-all duration-300 outline-none focus:border-red-600 text-white"
          />

          <button
            (click)="toggleLanguage()"
            class="flex items-center justify-center w-10 h-10 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 transition-all text-[10px] font-bold text-white tracking-tighter"
            [title]="
              movieService.language() === 'es-ES'
                ? 'Cambiar a Inglés'
                : 'Change to Spanish'
            "
          >
            @if (movieService.language() === "es-ES") {
              <span>ES</span>
            } @else {
              <span>EN</span>
            }
          </button>
        </div>

        @if (showSearch() && (searchResults().length > 0 || hasSearched())) {
          <div
            class="absolute top-full right-0 mt-2 w-80 bg-[#141414] border border-white/10 rounded-xl shadow-2xl overflow-hidden z-[60]"
          >
            @for (movie of searchResults(); track movie.id) {
              <div
                [routerLink]="['/pelicula', movie.id]"
                (click)="toggleSearch()"
                class="flex items-center gap-3 p-3 hover:bg-white/10 cursor-pointer transition-colors border-b border-white/5 last:border-0"
              >
                <img
                  [src]="
                    movie.poster_path
                      ? 'https://image.tmdb.org/t/p/w92' + movie.poster_path
                      : 'assets/no-image.png'
                  "
                  class="w-10 h-14 object-cover rounded-md shadow-md"
                />
                <div class="overflow-hidden">
                  <p class="text-sm font-bold text-white truncate">
                    {{ movie.title }}
                  </p>
                  <p class="text-xs text-gray-500">
                    {{ movie.release_date?.slice(0, 4) }}
                  </p>
                </div>
              </div>
            } @empty {
              @if (hasSearched()) {
                <div class="p-6 text-center">
                  <p class="text-gray-400 text-sm italic">
                    No se encontraron películas para esa búsqueda. 🔍
                  </p>
                </div>
              }
            }
          </div>
        }
      </div>
    </div>
  </div>
</header>
