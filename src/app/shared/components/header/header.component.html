<header
  [ngClass]="
    isScrolled()
      ? 'bg-black/80 backdrop-blur-md py-3 shadow-2xl'
      : 'bg-transparent py-5'
  "
  class="fixed top-0 left-0 w-full z-50 transition-all duration-500 ease-in-out"
>
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between gap-6">
    <!-- Logo -->
    <div class="flex items-center cursor-pointer group flex-shrink-0">
      <span
        routerLink="/"
        class="text-2xl font-black tracking-tighter text-white"
      >
        MOVIE<span
          class="text-red-600 group-hover:text-red-500 transition-colors"
          >FLIX</span
        >
      </span>
    </div>

    <!-- Search Bar - Always Visible -->
    <div class="flex-1 max-w-xl relative search-container">
      <div class="relative">
        <svg
          class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          #searchInput
          (input)="onTyping($event)"
          type="text"
          placeholder="Buscar películas..."
          class="w-full bg-black/60 border border-white/20 rounded-full py-2.5 pl-11 pr-4 text-sm transition-all duration-300 outline-none focus:border-red-600 focus:bg-black/80 text-white placeholder-gray-400"
        />
      </div>

      <!-- Search Results Dropdown -->
      @if (searchResults().length > 0 || hasSearched()) {
        <div
          class="absolute top-full left-0 right-0 mt-2 bg-[#141414] border border-white/10 rounded-xl shadow-2xl overflow-hidden z-[60] max-h-[400px] overflow-y-auto"
        >
          @for (movie of searchResults(); track movie.id) {
            <div
              [routerLink]="['/pelicula', movie.id]"
              (click)="clearSearch()"
              class="flex items-center gap-3 p-3 hover:bg-white/10 cursor-pointer transition-colors border-b border-white/5 last:border-0"
            >
              <img
                [src]="
                  movie.poster_path
                    ? 'https://image.tmdb.org/t/p/w92' + movie.poster_path
                    : 'assets/no-image.png'
                "
                class="w-10 h-14 object-cover rounded-md shadow-md"
              />
              <div class="overflow-hidden">
                <p class="text-sm font-bold text-white truncate">
                  {{ movie.title }}
                </p>
                <p class="text-xs text-gray-500">
                  {{ movie.release_date?.slice(0, 4) }}
                </p>
              </div>
            </div>
          } @empty {
            @if (hasSearched()) {
              <div class="p-6 text-center">
                <p class="text-gray-400 text-sm italic">
                  No se encontraron películas para esa búsqueda. 🔍
                </p>
              </div>
            }
          }
        </div>
      }
    </div>

    <!-- Language Toggle -->
    <div class="flex items-center gap-3 flex-shrink-0">
      <button
        (click)="toggleLanguage()"
        class="flex items-center justify-center w-10 h-10 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 transition-all text-[10px] font-bold text-white tracking-tighter"
        [title]="
          movieService.language() === 'es-ES'
            ? 'Cambiar a Inglés'
            : 'Change to Spanish'
        "
      >
        @if (movieService.language() === "es-ES") {
          <span>ES</span>
        } @else {
          <span>EN</span>
        }
      </button>
    </div>
  </div>
</header>
